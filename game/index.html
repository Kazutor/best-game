<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERDRIFT — Harvest the falling embers. Survive the void.</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a24; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="EMBERDRIFT: fly the ember-ship with WASD or the arrow keys, aim with the mouse, hold click to fire, and collect falling embers while dodging void shards"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
